  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f7f4ff 0%,#f7f8fc 52%,#eef4ff 100%);color:#24252d}
    .card{width:min(420px,calc(100vw - 32px));padding:34px;border:1px solid rgba(113,86,178,.15);border-radius:20px;background:rgba(255,255,255,.94);box-shadow:0 22px 60px rgba(53,42,87,.14)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;font-weight:800;color:#6546b4}
    .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#6f4bc2;color:#fff;box-shadow:0 8px 20px rgba(111,75,194,.26)}
    h1{font-size:22px;line-height:1.35;margin:0 0 8px}
    p{font-size:14px;line-height:1.7;margin:0 0 22px;color:#686b75}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
    input{width:100%;height:46px;border:1px solid #d9dbe3;border-radius:11px;padding:0 13px;font-size:15px;outline:none;transition:.18s}
    input:focus{border-color:#7955c6;box-shadow:0 0 0 3px rgba(121,85,198,.12)}
    button{width:100%;height:46px;margin-top:14px;border:0;border-radius:11px;background:#6f4bc2;color:#fff;font-size:15px;font-weight:750;cursor:pointer;transition:.18s}
    button:hover{background:#5f3fad;transform:translateY(-1px)}
    button:disabled{opacity:.68;cursor:wait;transform:none}
    .message{min-height:20px;margin-top:12px;font-size:13px;color:#d23c4b}
    .foot{margin-top:18px;font-size:12px;color:#989aa3;text-align:center}
  </style>
</head>

  <script>
    (function () {
      "use strict";
      var payload = JSON.parse(document.getElementById("bestreach-encrypted-payload").textContent);
      var form = document.getElementById("unlockForm");
      var input = document.getElementById("password");
      var button = document.getElementById("unlockButton");
      var message = document.getElementById("message");
      var encoder = new TextEncoder();
      var decoder = new TextDecoder("utf-8", { fatal: true });

      function fromBase64(value) {
        var binary = atob(value);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      async function unlock(password) {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error("当前浏览器环境不支持安全解密，请通过 HTTPS 地址访问。");
        }
        var keyMaterial = await crypto.subtle.importKey(
          "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
        );
        var key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: fromBase64(payload.salt),
            iterations: payload.iterations,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        var ciphertext = fromBase64(payload.ciphertext);
        var tag = fromBase64(payload.tag);
        var encrypted = new Uint8Array(ciphertext.length + tag.length);
        encrypted.set(ciphertext, 0);
        encrypted.set(tag, ciphertext.length);
        var plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromBase64(payload.iv), tagLength: 128 },
          key,
          encrypted
        );
        return decoder.decode(plaintext);
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";
        button.disabled = true;
        button.textContent = "正在验证…";
        try {
          var html = await unlock(input.value);
          input.value = "";
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          input.value = "";
          input.focus();
          message.textContent = error && error.message && error.message.indexOf("HTTPS") >= 0
            ? error.message
            : "密码错误，或加密文件已经损坏。";
          button.disabled = false;
          button.textContent = "验证并访问";
        }
      });
    }());
  </script>
